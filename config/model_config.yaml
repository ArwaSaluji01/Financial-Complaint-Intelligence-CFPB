baseline:
  tfidf:
    max_features: 100000
    ngram_range:
      - 1
      - 2
    min_df: 2
    sublinear_tf: true
    strip_accents: unicode

  classifier:
    C: 1.0
    class_weight: balanced
    max_iter: 3000
    random_state: 42

distilbert:
  model_name: distilbert-base-uncased
  max_length: 192
  batch_size: 8
  gradient_accumulation_steps: 2
  epochs: 2
  learning_rate: 0.00002
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  random_state: 42
  num_workers: 0
  cpu_threads: 4